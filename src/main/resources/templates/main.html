<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/profileEdit.css">
    <link rel="stylesheet" href="/css/gallery.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <script src="/js/common.js?ver=1.0"></script>
    
    <script src="/js/post.js?ver=1.1"></script>
    <script src="/js/message.js?ver=1.0"></script>
    <script src="/js/alert.js?ver=1.0"></script>
    <script src="/js/profile.js?ver=1.0"></script>
    <script src="/js/profileEdit.js?ver=1.0"></script>
    <script src="/js/gallery.js?ver=1.1"></script>

    <script src="/js/main.js?ver=1.7"></script>
</head>
<body>
    <div class="header">
        <button id="logoutBtn" class="logout-btn">로그아웃</button>
        <div class="header-left"></div>
        <img id="refreshBtn" src="/icons/refresh.png" alt="새로고침" class="icon">
        <img id="searchBtn" src="/icons/search.png" alt="검색" class="icon">
    </div>

    <div class="content" id="content">
        <div id="postList"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item"><img id="homeBtn" src="/icons/home.png" alt="홈" class="nav-icon active"></div>
        <div class="nav-item"><img id="messageBtn" src="/icons/message.png" alt="메시지" class="nav-icon"></div>
        <div class="nav-item"><img id="writeBtn" src="/icons/write.png" alt="글쓰기" class="nav-icon"></div>
        <div class="nav-item"><img id="alertBtn" src="/icons/alert.png" alt="알림" class="nav-icon"></div>
        <div class="nav-item"><img id="profileBtn" src="/icons/profile.png" alt="프로필" class="nav-icon"></div>
    </div>

    <!-- 이미지 모달 -->
    <div id="imageModal" class="modal">
        <button id="moreBtn" class="more-btn">...</button>
        <span id="closeImage" class="close">&times;</span>
        <img class="modal-content" id="modalImage">
        
        <div id="bottomSheet" class="bottom-sheet">
            <button class="sheet-btn" id="saveBtn">
                <img src="/icons/save.png" class="sheet-icon"> 갤러리 저장
            </button>
            <button class="sheet-btn" id="shareBtn">
                <img src="/icons/share.png" class="sheet-icon"> 공유하기
            </button>
        </div>
    </div>

    <!-- 폴더 모달 -->
    <div id="folderModal" class="modal">
        <div class="modal-content">
            <span id="closeFolder" class="close">&times;</span>
            <div class="folder-list" id="folderList">
                <!-- 폴더 버튼들 동적으로 로드 -->
            </div>
            <br>
            <button id="addFolderBtn" class="add-folder-btn">+ 폴더</button>
        </div>
    </div>

    <!-- 폴더 추가 모달 -->
    <div id="addFolderModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeFolderModal">&times;</span>
            <h3>새 폴더명</h3>
            <input type="text" id="newFolderName" placeholder="폴더 이름">
            <button id="createFolderBtn">생성</button>
        </div>
    </div>

    <div id="toast"><span id="toastMessage"></span></div>
</body>
</html>
